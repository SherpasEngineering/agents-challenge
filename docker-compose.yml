services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: asesoria
      POSTGRES_PASSWORD: asesoria
      POSTGRES_DB: asesoria
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asesoria"]
      interval: 2s
      retries: 20

  minio:
    # La imagen oficial minio/minio ya no se publica en Docker Hub.
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
